<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Illustration of an email, a chat bubble and a phone, for contact"><style>
@keyframes message-pop{0%,100%{opacity:0;transform:translateY(12px) scale(.86)}10%{opacity:1;transform:translateY(-3px) scale(1.04)}15%,82%{opacity:1;transform:translateY(0) scale(1)}90%{opacity:1;transform:translateY(-2px) scale(1.01)}}
.message-bubble{transform-box:fill-box;transform-origin:center;animation:message-pop 4.8s cubic-bezier(.2,.8,.2,1) infinite}
@media(prefers-reduced-motion:reduce){.message-bubble{animation:none}}
</style><rect width="800" height="600" fill="#f1dfd7"/>
